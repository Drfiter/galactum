# Galactum — cliente web (HTML5/WebAssembly) + proxy WebSocket hacia el SSS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El exportador web de Godot genera .wasm y .pck.
    types {
        application/wasm wasm;
        application/octet-stream pck;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/css;
    gzip_min_length 1024;

    # Aislamiento de origen (necesario si algún día se exporta con hilos).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # El cliente se conecta a ws(s)://<este sitio>/ws; nginx lo reenvía al SSS.
    # DNS interno de Docker: el nombre "server" se resuelve en cada conexión,
    # así nginx sigue funcionando si el contenedor del servidor se recrea.
    location /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sss_upstream http://server:9100;
        proxy_pass $sss_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
